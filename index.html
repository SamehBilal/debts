<!doctype html>
<html lang="en" dir="ltr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Debts</title>
	<meta name="description" content="Track what you owe — to friends, shops, cards and loans — with the place it happened, and a plan to pay it all off. Works offline; your data stays on your device.">
	<meta name="theme-color" content="#f4f8f2">
	<meta name="color-scheme" content="light dark">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" href="assets/img/icons/icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="assets/img/icons/icon-192.png">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="Debts">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&display=swap">
	<link rel="stylesheet" href="assets/css/app.css">
	<script>
		/* the theme and language before the first paint, so nothing flashes */
		try { var s = JSON.parse(localStorage.getItem('debts-state') || '{}').settings || {}; if (s.theme && s.theme !== 'auto') document.documentElement.setAttribute('data-theme', s.theme); if (s.lang === 'ar' || (!s.lang && /^ar\b/i.test(navigator.language))) { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; } } catch (e) {}
	</script>
</head>
<body>
	<header class="top">
		<a class="brand" href="#top"><img src="assets/img/icons/icon.svg" alt="" width="32" height="32"><span data-t="ديوني|Debts">Debts</span></a>
		<div class="tools">
			<button type="button" class="icon-btn" id="install" hidden data-tl="ثبّت التطبيق|Install the app">⤓</button>
			<button type="button" class="icon-btn" id="theme" data-tl="المظهر|Theme"></button>
			<button type="button" class="icon-btn" id="lang" data-tl="English|العربية">ع/E</button>
		</div>
	</header>
	<!-- one screen: the man and his sack; everything else opens as a modal out of its button -->
	<main id="top">
		<!-- the man, his sack, and what is owed on rolling reels -->
		<section class="stage">
			<nav class="hub" aria-label="Sections">
				<button type="button" data-panel="debts"><span aria-hidden="true">☰</span><b data-t="الديون|Debts">Debts</b></button>
				<button type="button" data-panel="plan"><span aria-hidden="true">📅</span><b data-t="الخطة|Plan">Plan</b></button>
				<button type="button" data-panel="places"><span aria-hidden="true">🗺️</span><b data-t="الأماكن|Places">Places</b></button>
				<button type="button" data-panel="settings"><span aria-hidden="true">⚙</span><b data-t="الإعدادات|Settings">Settings</b></button>
			</nav>
			<!-- ready-made moves, floating over the scene -->
			<div class="scenes" id="scenes"></div>
			<div class="jar" id="jar"></div>
			<!-- one coin's details: a hover peek on desktop, a tap card on phones -->
			<div class="peek" id="peek" role="dialog" aria-modal="false" hidden></div>
			<div class="owed">
				<span class="owed-cap" data-t="المتبقي عليك|Still owed">Still owed</span>
				<span class="owed-num" id="owed"></span>
				<span class="owed-sub" id="owed-sub"></span>
			</div>
		</section>
	</main>

	<!-- the ready buttons, always in reach -->
	<div class="dock">
		<button type="button" class="btn dock-add" data-open="add"><span aria-hidden="true">＋</span> <span data-t="أضف دينًا|Add debt">Add debt</span></button>
		<button type="button" class="btn dock-pay" data-open="pay"><span aria-hidden="true">✓</span> <span data-t="ادفع|Pay">Pay</span></button>
	</div>

	<!-- add or pay: who, how much (reels, steppers, the ruler, ready amounts), then one tap -->
	<dialog class="modal m-compose" id="m-compose" aria-labelledby="composer-title">
		<section class="composer" id="composer">
			<h2 class="sr" id="composer-title"></h2>
			<div class="seg mode" role="radiogroup">
				<button type="button" role="radio" data-mode="pay" class="m-pay"><span aria-hidden="true">✓</span> <span data-t="ادفع|Pay">Pay</span></button>
				<button type="button" role="radio" data-mode="add" class="m-add"><span aria-hidden="true">＋</span> <span data-t="دين جديد|Add debt">Add debt</span></button>
			</div>
			<div class="who" id="who"></div>
			<div class="new-fields" id="new-fields"></div>
			<div class="counter">
				<button type="button" class="step minus" data-tl="أقل|Less"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
				<button type="button" class="value" id="amount" data-tl="اسحب لأعلى أو لأسفل، أو اضغط لتكتب المبلغ|Drag up or down, or tap to type the amount"></button>
				<button type="button" class="step plus" data-tl="أكثر|More"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
				<input type="number" class="type-in" id="type-in" inputmode="decimal" min="0" step="any" hidden>
			</div>
			<div id="ruler" aria-labelledby="composer-title"></div>
			<p class="hint-row"><span class="hint h-drag" data-t="↔ اسحب المسطرة أو ارمها|↔ drag the ruler, or flick it">↔ drag the ruler, or flick it</span></p>
			<div class="chips" id="ready"></div>
			<div class="steps" id="steps"></div>
			<button type="button" class="btn big confirm" id="confirm"></button>
		</section>
	</dialog>

	<dialog class="modal" id="m-debts" aria-labelledby="debts-h"><button type="button" class="icon-btn modal-x" data-modal-close data-tl="إغلاق|Close">×</button><section class="block" id="debts"></section></dialog>
	<dialog class="modal" id="m-plan" aria-labelledby="plan-h"><button type="button" class="icon-btn modal-x" data-modal-close data-tl="إغلاق|Close">×</button><section class="block" id="plan"></section></dialog>
	<dialog class="modal" id="m-places" aria-labelledby="places-h"><button type="button" class="icon-btn modal-x" data-modal-close data-tl="إغلاق|Close">×</button><section class="block" id="places"></section></dialog>
	<dialog class="modal" id="m-settings" aria-labelledby="settings-h"><button type="button" class="icon-btn modal-x" data-modal-close data-tl="إغلاق|Close">×</button><section class="block" id="settings"></section></dialog>

	<dialog id="sheet" class="sheet"></dialog>

	<script src="assets/js/i18n.js"></script>
	<script src="assets/js/notify.js"></script>
	<script src="assets/js/store.js"></script>
	<script src="assets/js/plan.js"></script>
	<script src="assets/js/places.js"></script>
	<script src="assets/js/roller.js"></script>
	<script src="assets/js/jar.js"></script>
	<script src="assets/js/modal.js"></script>
	<script src="assets/js/app.js"></script>
	<script src="assets/js/pwa.js"></script>
</body>
</html>
